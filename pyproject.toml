[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcctl"
version = "0.1.0"
description = "Minecraft 临时服务器集群管理器(本地版):通过 Docker 编排多个 itzg/minecraft-server 实例"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0.0",
    "typer>=0.12.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
mcctl = "mcctl.cli:app"

[tool.setuptools.packages.find]
include = ["mcctl*"]

# 示例配置的模板要随包分发(mcctl config --write 会读它)。
[tool.setuptools.package-data]
"mcctl.core" = ["*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
